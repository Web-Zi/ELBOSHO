<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL.Bosho | المنيو</title><style>body{margin:0;background:#17120e;color:#21170e;font-family:Tahoma,Arial}.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:#f6a441;padding:20px;border-radius:22px;text-align:center}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button,.send{border:0;border-radius:20px;padding:10px 15px;background:#f6a441;font-weight:bold}.card{background:#fff4e4;padding:12px 14px;border-radius:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}.card button{border:0;border-radius:50%;width:36px;height:36px;background:#f6a441;font-size:20px}.cart{position:sticky;bottom:0;background:#211a14;color:white;padding:14px;border-radius:15px;display:flex;justify-content:space-between;align-items:center}.form{display:grid;gap:8px;margin:12px 0}.form input,.form textarea{padding:11px;border-radius:10px;border:1px solid #d6c5b0}#msg{color:white}</style><div class="wrap"><header class="hero"><h1>EL.Bosho البوشو</h1><div>منيو الطلبات</div><p>بعض أسماء وأسعار القائمة مستخرجة من صور المنيو وتحتاج مراجعة المطعم.</p></header><div id="tabs" class="tabs"></div><main id="items">جاري تحميل المنيو…</main><section class="form"><input id="customer" placeholder="الاسم"><input id="phone" placeholder="رقم الهاتف"><textarea id="note" placeholder="ملاحظات الطلب"></textarea></section><div class="cart"><span id="sum">السلة فارغة</span><button class="send" onclick="submitOrder()">إرسال الطلب</button></div><p id="msg"></p></div><script>
const API='https://YOUR-API-HOST';let products=[],cart={};const $=id=>document.getElementById(id);async function init(){try{let r=await fetch(API+'/menu');if(!r.ok)throw Error();products=await r.json();let cats=[...new Set(products.map(p=>p.category))];$('tabs').innerHTML=cats.map((c,i)=>`<button onclick="show('${encodeURIComponent(c)}')">${c}</button>`).join('');if(cats.length)show(encodeURIComponent(cats[0]));else $('items').textContent='المنيو غير متاح حالياً.'}catch(e){$('items').textContent='المنيو غير متاح حالياً. يرجى الاتصال بالمطعم.'}}function show(cat){cat=decodeURIComponent(cat);$('items').innerHTML=products.filter(p=>p.category===cat).map(p=>`<div class="card"><div>${p.name}<small style="display:block">${(p.price/100).toFixed(2)} ج.م</small></div><button onclick="add('${p.id}')">+</button></div>`).join('')}function add(id){cart[id]=(cart[id]||0)+1;update()}function update(){let n=Object.values(cart).reduce((a,b)=>a+b,0),s=Object.entries(cart).reduce((a,[id,q])=>a+products.find(p=>p.id===id).price*q,0);$('sum').textContent=n?`${n} صنف • ${(s/100).toFixed(2)} ج.م`:'السلة فارغة'}async function submitOrder(){if(!Object.keys(cart).length)return;$('msg').textContent='';let payload={customer:$('customer').value.trim(),phone:$('phone').value.trim(),note:$('note').value.trim(),items:Object.entries(cart).map(([product_id,qty])=>({product_id,qty,options:[]}))};if(!payload.customer||!payload.phone){$('msg').textContent='يرجى كتابة الاسم ورقم الهاتف.';return}try{let r=await fetch(API+'/orders',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify(payload)});let d=await r.json();if(!r.ok)throw Error(d.error||'تعذر إرسال الطلب');$('msg').textContent=`تم إرسال الطلب بنجاح. رقم الطلب: ${d.id.slice(0,8)}`;cart={};update()}catch(e){$('msg').textContent='تعذر إرسال الطلب الآن. يرجى الاتصال بالمطعم.'}}init();</script></html>
